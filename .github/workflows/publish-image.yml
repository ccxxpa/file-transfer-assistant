name: Publish image
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: publish-image
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check release version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and test native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA-$ARCH" .
          node deploy/smoke-test.mjs "$IMAGE:$GITHUB_SHA-$ARCH"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:$GITHUB_SHA-$ARCH"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_REF_NAME#v}" --tag "$IMAGE:latest" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"
