name: Verify public image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to pull and test without credentials
        required: true
        default: '1.2.1'
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository }}
  VERSION: ${{ inputs.version }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Pull and test anonymously
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          docker pull "$IMAGE:$VERSION"
          node deploy/smoke-test.mjs "$IMAGE:$VERSION"
